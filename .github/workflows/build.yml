name: build

# 触发:
#  - 任意提交(push)/ PR  → 仅检查代码(analyze + test)
#  - 推送 vX.Y.Z 形式的 tag → 检查 + 五端构建 + 发布 Release
#  - 手动 workflow_dispatch → 检查 + 五端构建(不发布)
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.0

permissions:
  contents: write # 发布 Release 需要

jobs:
  # ── 提交即检查:分析 + 单测(所有触发都跑,作为构建/发布的前置门槛) ──
  analyze-test:
    name: 分析与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ── Android:arm64-v8a / armeabi-v7a / x86_64 三个 ABI 的 APK ──
  build-android:
    name: 构建 Android
    needs: analyze-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 计算版本号
        id: ver
        run: echo "v=$(.github/version.sh)" >> "$GITHUB_OUTPUT"

      - name: 还原签名密钥(来自 Secrets)
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 SIGN_KEYSTORE_BASE64,将使用 debug 签名构建。"
            exit 0
          fi
          echo "$SIGN_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 构建 APK(按 ABI 拆分)
        run: flutter build apk --release --split-per-abi
      - name: 汇集产物
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release\.apk/\1/')
            cp "$f" "dist/sub2api_android_${V}_${abi}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  # ── Windows x64:便携 zip + Inno Setup 安装包 ──
  build-windows:
    name: 构建 Windows (x64)
    needs: analyze-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 计算版本号
        id: ver
        shell: bash
        run: echo "v=$(bash .github/version.sh)" >> "$GITHUB_OUTPUT"
      - run: flutter build windows --release
      - name: 便携 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "dist/sub2api_windows_${{ steps.ver.outputs.v }}_x64_portable.zip"
      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y
      - name: 生成安装包(setup.exe)
        shell: bash
        run: |
          V="${{ steps.ver.outputs.v }}"
          cat > installer.iss <<EOF
          [Setup]
          AppName=Sub2api
          AppVersion=${V}
          AppPublisher=gucooing
          DefaultDirName={autopf}\\Sub2api
          DefaultGroupName=Sub2api
          OutputDir=dist
          OutputBaseFilename=sub2api_windows_${V}_x64_setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          [Files]
          Source: "build\\windows\\x64\\runner\\Release\\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\\Sub2api"; Filename: "{app}\\sub2api.exe"
          Name: "{commondesktop}\\Sub2api"; Filename: "{app}\\sub2api.exe"
          [Run]
          Filename: "{app}\\sub2api.exe"; Description: "运行 Sub2api"; Flags: nowait postinstall skipifsilent
          EOF
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  # ── Linux x64:tar.gz + deb + AppImage ──
  build-linux:
    name: 构建 Linux (x64)
    needs: analyze-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config liblzma-dev file
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 计算版本号
        id: ver
        run: echo "v=$(bash .github/version.sh)" >> "$GITHUB_OUTPUT"
      - run: flutter build linux --release
      - name: 打包 tar.gz / deb / AppImage
        run: bash .github/package-linux.sh "${{ steps.ver.outputs.v }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  # ── macOS:universal(arm64+x64)dmg ──
  build-macos:
    name: 构建 macOS (universal)
    needs: analyze-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 计算版本号
        id: ver
        run: echo "v=$(bash .github/version.sh)" >> "$GITHUB_OUTPUT"
      - run: flutter build macos --release
      - name: 打包 dmg
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p dist
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          hdiutil create -volname Sub2api -srcfolder "$APP" -ov -format UDZO "dist/sub2api_macos_${V}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  # ── iOS arm64:未签名 ipa(未提供证书;自签 / 侧载用) ──
  build-ios:
    name: 构建 iOS (arm64, 未签名)
    needs: analyze-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 计算版本号
        id: ver
        run: echo "v=$(bash .github/version.sh)" >> "$GITHUB_OUTPUT"
      - run: flutter build ios --release --no-codesign
      - name: 打包未签名 ipa
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "dist/sub2api_ios_${V}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  # ── 仅在 tag(版本号)推送时发布 Release ──
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总产物
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
